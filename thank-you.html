<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application Received · REGENT STRANDS</title>
<link rel="icon" href="regent-logo.jpeg">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  font-family:Georgia, "Times New Roman", serif;
  background:#f3f0df; color:#173b2d; padding:24px;
}
.card{
  width:min(680px,100%); text-align:center; padding:58px 34px;
  background:#fbfaf2; border:1px solid #b7a76a; box-shadow:0 18px 60px rgba(23,59,45,.12);
}
.logo{width:82px;height:82px;object-fit:cover;border-radius:50%;margin-bottom:22px}
.eyebrow{letter-spacing:.18em;font-size:12px;font-weight:700}
h1{font-size:clamp(34px,7vw,58px);margin:16px 0 18px}
p{font-family:Arial,sans-serif;line-height:1.7;font-size:16px;max-width:520px;margin:0 auto 28px}
.btn{
  display:inline-block; text-decoration:none; padding:14px 24px;
  background:#173b2d; color:#f3f0df; letter-spacing:.08em;
  font:700 12px Arial,sans-serif;
}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="regent-logo.jpeg" alt="Regent Strands logo">
  <div class="eyebrow">REGENT STRANDS CREATOR COLLECTIVE</div>
  <h1>Application Received</h1>
  <p>Thank you for applying to the Regent Strands Creator Collective. Your application has been received successfully and our team will review your details.</p>
  <a class="btn" href="index.html">RETURN TO REGENT STRANDS</a>
</main>
</body>
</html>
